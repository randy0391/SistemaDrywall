<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="Calculadora profesional de materiales de Drywall con simulador y visor 3D interactivo para celular." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drywall Pro" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>DrywallCalc Pro 3D - Calculadora & Diseñador</title>

    <!-- Fail-safe auto-recovery for stale cached assets -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'drywall_auto_reload';
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
